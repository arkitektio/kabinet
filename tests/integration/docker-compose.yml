services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/daten:latest
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: kabinet
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  kabinet:
    depends_on:
    - redis
    - db
    - rustfs
    image: ${KABINET_SERVICE_IMAGE:-jhnnsrs/kabinet:${KABINET_SERVICE_TAG:-latest}}
    command: bash run-debug.sh
    stop_grace_period: 1s
    ports:
    - 6888:80
    volumes:
    - ./configs/kabinet.yaml:/workspace/config.yaml
  rustfs:
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: rustfs/rustfs:latest
    ports:
    - 6889:9000
  initc:
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_HOST: http://rustfs:9000
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: jhnnsrs/init:latest
    volumes:
    - ./configs/rustfs.yaml:/workspace/config.yaml


