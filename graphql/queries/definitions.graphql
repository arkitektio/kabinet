query ListDefinitions {
  definitions {
    ...ListDefinition
  }
}

query GetDefinitionByHash($hash: ActionHash) {
  definition(hash: $hash) {
    ...Definition
  }
}

query GetDefinition($id: ID!) {
  definition(id: $id) {
    ...Definition
  }
}

query SearchDefinitions($search: String, $values: [ID!], $limit: Int, $offset: Int) {
  options: definitions(
    filters: { search: $search, ids: $values }
    pagination: { limit: $limit, offset: $offset }
  ) {
    value: id
    label: name
  }
}

# What could be installed to do something: definitions by name or meaning,
# each with the releases whose flavours provide it.
query SearchInstallable($search: String!, $limit: Int = 10) {
  definitions(filters: { search: $search }, pagination: { limit: $limit }) {
    ...InstallableDefinition
  }
}

query GetInstallable($id: ID!) {
  definition(id: $id) {
    ...InstallableDefinition
  }
}
