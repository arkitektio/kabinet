query GetReleaseApproval($id: ID!) {
  releaseApproval(id: $id) {
    ...ReleaseApproval
  }
}

query ListReleaseApprovals {
  releaseApprovals {
    ...ReleaseApproval
  }
}

query SearchReleaseApprovals($search: String, $values: [ID!], $limit: Int, $offset: Int) {
  options: releaseApprovals(
    filters: { search: $search, ids: $values, revoked: false }
    pagination: { limit: $limit, offset: $offset }
  ) {
    value: id
    label: name
  }
}
