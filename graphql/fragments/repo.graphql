fragment GithubRepo on GithubRepo {
    id
    branch
    user 
    repo
    flavours {
        definitions {
            id
            hash
        }
    }
}

fragment OciRepo on OciRepo {
    id
    reference
    registry
    repository
    channels
    scannedAt
    flavours {
        id
        name
        release {
            id
            version
            channel
        }
    }
}
