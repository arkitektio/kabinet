fragment Release on Release {
  id
  version
  channel
  revision
  app {
    identifier
  }
  scopes
  approvalDigest
  mandateManifest
  flavours {
    ...ListFlavour
  }
}

fragment ListRelease on Release {
  id
  version
  channel
  revision
  app {
    identifier
  }
  scopes
  flavours {
    ...ListFlavour
  }
}
